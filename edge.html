<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contest Dashboard</title>
<style>
  :root { --bg:#ffffff; --panel:#f7f7f8; --line:#e3e3e6; --text:#1a1a1c; --muted:#6b6b73; --accent:#2f6fd0; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --panel:#1e2024; --line:#2e3136; --text:#e9e9ec; --muted:#9a9aa4; --accent:#6aa3f0; --bad:#e57373; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:24px; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:24px; width:100%; max-width:340px; }
  h1 { font-size:16px; margin:0 0 4px; }
  p { color:var(--muted); font-size:12px; margin:0 0 16px; }
  input { width:100%; padding:9px 11px; font-size:14px; border-radius:6px; border:1px solid var(--line);
          background:var(--bg); color:var(--text); }
  button { width:100%; margin-top:10px; padding:9px; font-size:14px; border:0; border-radius:6px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--bad); font-size:12px; margin-top:10px; min-height:1em; }
</style>

<form id="f">
  <h1>Contest Dashboard</h1>
  <p>This page is encrypted. Enter the password to view it.</p>
  <input type="password" id="pw" autocomplete="current-password" autofocus placeholder="Password">
  <button type="submit" id="go">Unlock</button>
  <div class="err" id="err"></div>
</form>

const KEY_CACHE = 'dashboard-pw';
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(password) {
  const material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  // Try each wrapped content key. AES-GCM is authenticated, so a wrong password throws rather
  // than yielding garbage — that is what makes trying them in turn safe.
  for (const k of PAYLOAD.keys) {
    let raw;
    try {
      const kek = await crypto.subtle.deriveKey(
        {name: 'PBKDF2', salt: b(k.salt), iterations: PAYLOAD.iter, hash: 'SHA-256'},
        material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      raw = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(k.iv)}, kek, b(k.wrapped));
    } catch (e) {
      continue;                       // not this password's wrap; try the next
    }
    const cek = await crypto.subtle.importKey(
      'raw', raw, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      {name: 'AES-GCM', iv: b(PAYLOAD.iv)}, cek, b(PAYLOAD.ct));
    return new TextDecoder().decode(plain);
  }
  throw new Error('no key matched');
}

function render(html) {
  document.open();
  document.write(html);   // document.write so the page's own <script> runs
  document.close();
}

async function attempt(password, fromCache) {
  const err = document.getElementById('err');
  const go = document.getElementById('go');
  if (go) { go.disabled = true; go.textContent = 'Decrypting…'; }
  try {
    const html = await unlock(password);
    sessionStorage.setItem(KEY_CACHE, password);   // survives the hourly auto-refresh
    render(html);
  } catch (e) {
    sessionStorage.removeItem(KEY_CACHE);
    if (!fromCache && err) err.textContent = 'Wrong password.';
    if (go) { go.disabled = false; go.textContent = 'Unlock'; }
  }
}

document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault();
  attempt(document.getElementById('pw').value, false);
});

const cached = sessionStorage.getItem(KEY_CACHE);
if (cached) attempt(cached, true);
